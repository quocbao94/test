<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sơ đồ tầng tương tác</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        svg { width: 90%; display: block; margin: auto; }
        .apartment { cursor: pointer; transition: fill 0.3s; }
        .form-container { margin-top: 20px; display: none; }
    </style>
</head>
<body>

    <h1>Sơ đồ tầng - Nhấp vào căn hộ để chỉnh sửa tiến độ</h1>

    <svg viewBox="0 0 900 400">
        <script>
            let positions = [];
            let startX = 50, startY = 50, width = 100, height = 100, gap = 120;

            // Hàng trên: Căn hộ 1-7
            for (let i = 0; i < 7; i++) {
                positions.push([startX + (i * gap), startY]);
            }
            // Hàng dưới: Căn hộ 8-14
            for (let i = 0; i < 7; i++) {
                positions.push([startX + (i * gap), startY + 150]);
            }

            positions.forEach((pos, index) => {
                document.write(`<rect id="${index + 1}" class="apartment" x="${pos[0]}" y="${pos[1]}" width="${width}" height="${height}" onclick
